server.port=8080

spring.application.name=GATEWAY-SERVICE

spring.cloud.gateway.server.webmvc.routes[0].id=CATALOG-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://CATALOG-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/catalog/**

spring.cloud.gateway.server.webmvc.routes[1].id=BATTLE-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://BATTLE-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/battle/**

spring.cloud.gateway.server.webmvc.routes[2].id=RANKING-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://RANKING-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/ranking/**

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
