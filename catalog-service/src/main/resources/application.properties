server.port=8081

spring.application.name=CATALOG-SERVICE

spring.datasource.url=jdbc:postgresql://localhost:5432/db_catalog
spring.datasource.username=backend-unisinos
spring.datasource.password=unisinos
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

spring.mvc.problemdetails.enabled=true

# TMDB (The Movie Database) - a chave vem da variavel de ambiente TMDB_API_KEY (nao commitar)
tmdb.api-key=${TMDB_API_KEY:}
tmdb.base-url=https://api.themoviedb.org/3
tmdb.image-base-url=https://image.tmdb.org/t/p/w500
tmdb.language=pt-BR
